services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: jiwei-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      # 统一时区为东八区：与应用 JDBC serverTimezone=Asia/Shanghai、Java LocalDateTime.now() 对齐。
      # 此前容器默认 UTC，导致 SQL 脚本/mysql 客户端 NOW() 写入 UTC 字面，与应用写入差 8 小时。
      TZ: Asia/Shanghai
    volumes:
      # 数据卷统一 external 固定物理名 jiwei_*，避免 compose 因目录/项目名变化而新建空卷丢数据
      - jiwei_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
    restart: unless-stopped

  # ========== Redis 7.x ==========
  redis:
    image: redis:7-alpine
    container_name: jiwei-redis
    ports:
      - "6380:6379"
    volumes:
      - jiwei_redis_data:/data
    restart: unless-stopped

  # ========== MongoDB 7.x ==========
  mongodb:
    image: mongo:7
    container_name: jiwei-mongodb
    ports:
      - "27017:27017"
    volumes:
      - jiwei_mongo_data:/data/db
    restart: unless-stopped

  # ========== PostgreSQL 16 + pgvector ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jiwei-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jiwei_ai
    volumes:
      - jiwei_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ========== RocketMQ NameServer ==========
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: jiwei-rmq-namesrv
    # 显式 hostname + hosts 映射：容器默认 hostname（容器 ID）不可解析时，
    # RocketMQ MixAll.localhost() 回退会无限递归导致 StackOverflow
    hostname: rocketmq-namesrv
    extra_hosts:
      - "rocketmq-namesrv:127.0.0.1"
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    restart: unless-stopped

  # ========== RocketMQ Broker ==========
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: jiwei-rmq-broker
    hostname: rocketmq-broker
    extra_hosts:
      - "rocketmq-broker:127.0.0.1"
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./deploy/rmq-broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    restart: unless-stopped

volumes:
  # 四个数据卷均 external 固定物理名 jiwei_*，与容器名一致，符合命名规范；
  # 显式引用避免 compose 因目录名/项目名变化而新建空卷导致数据失联。
  jiwei_mysql_data:
    external: true
    name: jiwei_mysql_data
  jiwei_redis_data:
    external: true
    name: jiwei_redis_data
  jiwei_mongo_data:
    external: true
    name: jiwei_mongo_data
  jiwei_pg_data:
    external: true
    name: jiwei_pg_data
