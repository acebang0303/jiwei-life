server:
  port: 8080

spring:
  application:
    name: jiwei-modules
  profiles:
    active: dev
  config:
    import: "optional:file:../.env[.properties]"
  threads:
    virtual:
      enabled: true                        # JDK 21 虚拟线程
  datasource:
    dynamic:
      primary: auth                        # 默认数据源
      strict: false                        # 未匹配到数据源时回退到 primary
      hikari:
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 20
        minimum-idle: 5
      datasource:
        auth:
          url: jdbc:mysql://localhost:3307/jiwei_auth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
        user:
          url: jdbc:mysql://localhost:3307/jiwei_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
        merchant:
          url: jdbc:mysql://localhost:3307/jiwei_merchant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
        trade:
          url: jdbc:mysql://localhost:3307/jiwei_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
        market:
          url: jdbc:mysql://localhost:3307/jiwei_market?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
        social:
          url: jdbc:mysql://localhost:3307/jiwei_social?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: ${JIWEI_MYSQL_PASSWORD:root123}
  data:
    redis:
      host: ${JIWEI_REDIS_HOST:localhost}
      port: ${JIWEI_REDIS_PORT:6380}
      password: ${JIWEI_REDIS_PASSWORD:}
      database: ${JIWEI_REDIS_DATABASE:0}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jiwei.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

rocketmq:
  name-server: ${JIWEI_ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: jiwei-producer-group

jiwei:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET}
    user-ttl: 604800000                     # 7天
    user-token-name: Authorization
  alioss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY}
    access-key-secret: ${OSS_ACCESS_SECRET}
    bucket-name: jiwei-life
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
    mchid: ${WECHAT_MCHID}
    api-v3-key: ${WECHAT_API_KEY}
    notify-url: https://your-domain/api/notify/pay
  baidu:
    ak: ${BAIDU_AK}
  ai:
    base-url: https://api.deepseek.com/v1
    api-key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
    service-url: ${AI_SERVICE_URL:http://localhost:8087}

like:
  hot:
    window-seconds: 2          # 热点评估窗口（秒），HotKeyDetector 评估周期
    threshold-per-window: 30   # 窗口内操作数阈值，超过则进入热点模式
    cooldown-cycles: 5         # 连续低于阈值的冷却周期数，达标则退出热点
    flush-interval-ms: 1500    # 本地聚合刷回 Redis 间隔（毫秒）
  consumer:
    interval-ms: 1000          # 攒批消费窥探间隔（毫秒）
    batch-size: 500            # 攒批触发阈值（条数）
    max-drain: 5000            # 单次窥探最大事件数
  reconcile-interval-ms: 30000 # 兜底对账间隔（毫秒）

shortlink:
  click:
    flush-interval-ms: 5000    # 点击计数本地攒批落库间隔（毫秒）
    max-codes-per-flush: 2000  # 单次落库最多合并的短码数
  rate-limit:
    limit-per-window: 100      # 生成接口限额（全局，Redis 令牌桶）
    window-seconds: 60         # 限额窗口（秒）
    trust-forwarded-for: false # 仅在可信反向代理之后再开启，否则按 remoteAddr 限流
    degrade-instances: 1       # Redis 不可用时本机降级桶按实例数摊薄额度

seckill:
  breaker:
    window-millis: 10000       # 滑动窗口总长度（毫秒）
    bucket-count: 10           # 窗口分片数（越细越平滑）
    minimum-calls: 20          # 窗口内最少样本数，低于此值不判定（低流量保护）
    failure-rate-threshold: 50 # 故障率阈值(%)
    open-duration-ms: 30000    # 熔断持续时长
    half-open-permits: 5       # HALF_OPEN 连续成功多少次恢复
    half-open-max-concurrent: 3 # HALF_OPEN 并发探针上限
  ratelimit:
    degrade-instances: 1       # Redis 不可用时本机令牌桶按实例数摊薄额度
